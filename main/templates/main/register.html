{% extends 'main/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'main/css/auth.css' %}">
{% endblock %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="auth-box">
    <div class="auth-card">

        <!-- Форма реєстрації -->
        <form method="POST" action="" class="auth-form">
            {% csrf_token %}
            <div class="auth-title">Register</div>
            <div class="auth-subtitle">Join to us</div>

            <label for="name">Your name</label>
            <input type="text" id="name" name="name" placeholder="Jhon Deo">

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Example@gmail.com">

            <label for="password">Password</label>
            <div class="auth-pass">
                <input type="password" id="password" name="password" placeholder="....">
                <button type="button" class="eye-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
            </div>

            <label for="password2">Confirm Password</label>
            <div class="auth-pass">
                <input type="password" id="password2" name="password2" placeholder="....">
                <button type="button" class="eye-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
            </div>

            <button type="submit" class="auth-btn">Register</button>
            <div class="auth-bottom">Already user ? <a href="/login/">Login</a></div>
        </form>
    </div>
</div>

<!-- Показати/сховати пароль -->
<script>
    document.querySelectorAll('.eye-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
            var input = btn.parentElement.querySelector('input');
            input.type = input.type === 'password' ? 'text' : 'password';
        });
    });
</script>

{% endblock %}
